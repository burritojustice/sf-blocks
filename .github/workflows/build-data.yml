# The builder behind "Add a map layer", "Add areas" and "Rebuild data" (and the rebuild when a pull request
# edits a map layer's entry). Those are the ones to run, from Actions; this one only runs when they call it.
#   Boundary set: areas to join to (scripts/add_boundary_set.py), from DataSF or a file in data/uploads/.
#   Map layer: points, lines or polygons for the maps (scripts/build_tiles.py), tiled with tippecanoe when
#     big. A new layer gets an entry in data/tiles/sources/<id>.json with the suggested fields and is built in
#     the same run; edit that file on the pull request and the layer is rebuilt (rebuild-on-edit.yml).
#   Search index (scripts/build_search.py), OSM ways (scripts/build_osm.py), Street facts
#     (scripts/build_facts.py, which also reruns by itself after the street trees, businesses, census blocks
#     or a district set are built, so the facts never fall behind).
# It writes its notes in changes/<name>.md (the Stamp version action sets VERSION and CHANGELOG.md after the
# merge) and opens a pull request with a report, or adds a commit to the branch it's run on.
# Needs: Settings → Actions → General → Workflow permissions: "Read and write", and
# "Allow GitHub Actions to create and approve pull requests".
name: Build data
on:
  workflow_call:
    inputs:
      kind: { type: string, required: true }
      id: { type: string, required: false, default: '' }
      source: { type: string, required: false, default: '' }
      name_field: { type: string, required: false, default: '' }
      label: { type: string, required: false, default: '' }
      year: { type: string, required: false, default: '' }
      tab: { type: string, required: false, default: 'Other' }
      keep: { type: string, required: false, default: '' }
      branch: { type: string, required: false, default: '' }
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch || github.ref }}
      - name: Branch
        id: branch
        env:
          IN_ID: ${{ inputs.id }}
          IN_KIND: ${{ inputs.kind }}
          IN_BRANCH: ${{ inputs.branch }}
        run: |
          case "$IN_KIND" in "Map layer"|"Boundary set")
            if ! [[ "$IN_ID" =~ ^[a-z][a-z0-9_]{2,40}$ ]]; then echo "The id should be lowercase words joined by _, like bus_stops (got: $IN_ID)"; exit 1; fi;;
          *) IN_ID=$(echo "$IN_KIND" | tr 'A-Z ' 'a-z_');; esac
          echo "id=$IN_ID" >> "$GITHUB_OUTPUT"
          if [ -n "$IN_BRANCH" ]; then echo "name=$IN_BRANCH" >> "$GITHUB_OUTPUT"; echo "new=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$GITHUB_REF_NAME" = main ]; then
            case "$IN_KIND" in "Map layer") pre=layer;; "Boundary set") pre=areas;; *) pre=rebuild;; esac
            b="$pre-$IN_ID-$(date +%Y%m%d)-$GITHUB_RUN_NUMBER"; git checkout -b "$b"; echo "new=1" >> "$GITHUB_OUTPUT"
          else b="$GITHUB_REF_NAME"; echo "new=0" >> "$GITHUB_OUTPUT"; fi
          echo "name=$b" >> "$GITHUB_OUTPUT"
      - name: Build the set
        if: inputs.kind == 'Boundary set'
        env:
          IN_ID: ${{ inputs.id }}
          IN_SOURCE: ${{ inputs.source }}
          IN_NAME: ${{ inputs.name_field }}
          IN_LABEL: ${{ inputs.label }}
          IN_TAB: ${{ inputs.tab }}
          IN_KEEP: ${{ inputs.keep }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          python3 scripts/add_boundary_set.py --id "$IN_ID" --source "$IN_SOURCE" --name "$IN_NAME" --label "$IN_LABEL" \
            --tab "$IN_TAB" --keep "$IN_KEEP" --branch "$BRANCH" --summary "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
      # map layers: tippecanoe (built once, then cached), then propose fields for a new layer or build a listed one
      - name: tippecanoe
        if: inputs.kind == 'Map layer' || inputs.kind == 'OSM ways'
        id: tc
        uses: actions/cache@v4
        with:
          path: ~/tippecanoe
          key: tippecanoe-4f26211
      - name: Build tippecanoe
        if: (inputs.kind == 'Map layer' || inputs.kind == 'OSM ways') && steps.tc.outputs.cache-hit != 'true'
        run: |
          # 2.82.0 isn't tagged (tags stop at 2.79.0), so pin the commit
          git init -q ~/tippecanoe-src && git -C ~/tippecanoe-src fetch -q --depth 1 https://github.com/felt/tippecanoe.git 4f2621186acfec33b63ddf636f665623c0fef2dd && git -C ~/tippecanoe-src checkout -q FETCH_HEAD
          make -C ~/tippecanoe-src -j4 > /dev/null
          mkdir -p ~/tippecanoe && cp ~/tippecanoe-src/tippecanoe ~/tippecanoe-src/tile-join ~/tippecanoe-src/tippecanoe-decode ~/tippecanoe/
      - name: Build the layer
        if: inputs.kind == 'Map layer'
        env:
          IN_ID: ${{ inputs.id }}
          IN_SOURCE: ${{ inputs.source }}
          IN_LABEL: ${{ inputs.label }}
          IN_YEAR: ${{ inputs.year }}
          IN_KEEP: ${{ inputs.keep }}
          BRANCH: ${{ steps.branch.outputs.name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ds=$(echo "$IN_SOURCE" | grep -oE '[a-z0-9]{4}-[a-z0-9]{4}' | tail -1 || true)
          : > "$RUNNER_TEMP/body.md"
          if python3 -c "import sys; sys.path.insert(0, 'scripts'); import build_tiles as b; sys.exit(0 if any(l['id'] == '$IN_ID' for l in b.load_sources()) else 1)"; then
            verb=Rebuilt
          else
            # a new layer: its entry with the suggested fields, then build it in the same run
            [ -n "$ds" ] || { echo "A new layer needs its DataSF dataset (a link or an id like 63x5-g3m4)"; exit 1; }
            python3 scripts/build_tiles.py --profile "$ds" --add "$IN_ID" --label "$IN_LABEL" --year "${IN_YEAR:-current}" --keep "$IN_KEEP" --report "$RUNNER_TEMP/profile.md" > /dev/null
            verb=Added
          fi
          mkdir -p "$RUNNER_TEMP/raw"
          python3 scripts/build_tiles.py "$IN_ID" --tippecanoe ~/tippecanoe --raw "$RUNNER_TEMP/raw" --report "$RUNNER_TEMP/body.md"
          # raw downloads: in data/uploads/ when small, otherwise attached to a release (archived, not served)
          for f in "$RUNNER_TEMP"/raw/*; do
            [ -e "$f" ] || continue
            name="$(basename "${f%.*}")_$(date +%Y%m%d).${f##*.}"
            if [ "$(stat -c %s "$f")" -lt 10000000 ]; then cp "$f" "data/uploads/$name"; echo "- Raw copy: \`data/uploads/$name\`" >> "$RUNNER_TEMP/body.md"
            else
              gzip -9 -c "$f" > "$RUNNER_TEMP/$name.gz"
              tag="raw-$IN_ID-$(date +%Y%m%d)-$GITHUB_RUN_NUMBER"
              gh release create "$tag" "$RUNNER_TEMP/$name.gz" --title "Raw download: $IN_ID $(date +%Y-%m-%d)" --notes "Archived by the Build data action (run $GITHUB_RUN_NUMBER). Not used by the apps." --target "$GITHUB_SHA" > /dev/null
              echo "- Raw copy (too big for the repo): release [$tag]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag)" >> "$RUNNER_TEMP/body.md"
            fi
          done
          # see it in the apps before merging: they read sf-blocks from this branch
          live="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$BRANCH/"
          { echo; echo "**Preview** (reads this branch): [Joiner](https://burritojustice.github.io/joiner/?sfblocks=$live&layers=$IN_ID) · [Block Party](https://burritojustice.github.io/block-party/?sfblocks=$live)"; } >> "$RUNNER_TEMP/body.md"
          f=data/tiles/sources/$IN_ID.json; [ -f "$f" ] || f=data/tiles/sources.json
          { echo; echo "To change the fields, categories or zooms, edit \`$f\` on this pull request's branch: the layer is rebuilt by itself."; } >> "$RUNNER_TEMP/body.md"
          [ -f "$RUNNER_TEMP/profile.md" ] && { echo; echo '<details><summary>Field report</summary>'; echo; cat "$RUNNER_TEMP/profile.md"; echo; echo '</details>'; } >> "$RUNNER_TEMP/body.md"
          { echo "**$verb map layer \`$IN_ID\`**"; echo; cat "$RUNNER_TEMP/body.md"; } > "$RUNNER_TEMP/summary.md"
          grep -m1 '^- \*\*' "$RUNNER_TEMP/body.md" > "changes/layer-$IN_ID.md" || echo "- $verb map layer \`$IN_ID\`." > "changes/layer-$IN_ID.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Build the search index
        if: inputs.kind == 'Search index'
        run: |
          python3 scripts/build_search.py 2> "$RUNNER_TEMP/log.txt"
          python3 - "$RUNNER_TEMP/summary.md" <<'PY'
          import sys, json, pathlib
          out = pathlib.Path(sys.argv[1])
          i = json.loads(pathlib.Path('data/search/index.json').read_text())
          line = (f"- **Search index rebuilt:** {i['businesses']['n']:,} businesses (DataSF `{i['businesses']['dataset']}`, {i['businesses']['as_of']}), "
                  f"{i['addresses']['n']:,} addresses on {len(i['streets']):,} streets and {i['landmarks']['n']:,} landmarks (`{i['addresses']['dataset']}`, {i['addresses']['as_of']}).")
          out.write_text('**Rebuilt the search index**\n\n' + line + '\n')
          pathlib.Path('changes/rebuild-search.md').write_text(line + '\n')
          PY
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Build the OSM ways
        if: inputs.kind == 'OSM ways'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool > /dev/null
          T="$RUNNER_TEMP"
          curl -fsSL -o "$T/norcal.osm.pbf" https://download.geofabrik.de/north-america/us/california/norcal-latest.osm.pbf
          asof=$(osmium fileinfo -g header.option.osmosis_replication_timestamp "$T/norcal.osm.pbf" | cut -c1-10)
          # the city's outline (bay_area_counties), then only the ways tagged highway=*
          python3 -c "import json; d=json.load(open('data/boundaries/bay_area_counties.geojson')); print(json.dumps({'type':'FeatureCollection','features':[f for f in d['features'] if f['properties'].get('county')=='San Francisco']}))" > "$T/sf.geojson"
          osmium extract -p "$T/sf.geojson" -s smart "$T/norcal.osm.pbf" -o "$T/sf.osm.pbf"
          osmium tags-filter "$T/sf.osm.pbf" w/highway -o "$T/sf-highways.osm"
          python3 scripts/build_osm.py "$T/sf-highways.osm" --as-of "$asof" --geojsonseq "$T/pieces.geojsonseq" --report "$T/body.md"
          # each piece stays its own feature with its id: no dropping, no merging; sidewalks from zoom 15 (set per feature)
          TC=(-l ways -Z12 -z16 --force --no-feature-limit --no-tile-size-limit -r1 --simplification=2 '--attribution=<a href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors</a>')
          ~/tippecanoe/tippecanoe "${TC[@]}" -o data/osm/ways.pmtiles "$T/pieces.geojsonseq"
          ~/tippecanoe/tippecanoe "${TC[@]}" -j '{"*":["!in","kind","sidewalk","crossing"]}' -o "$T/no-sidewalks.pmtiles" "$T/pieces.geojsonseq"
          printf -- '- Tiles (`data/osm/ways.pmtiles`): %s MB; without sidewalks and crosswalks it would be %s MB.\n' \
            "$(echo "scale=1; $(stat -c %s data/osm/ways.pmtiles)/1000000" | bc)" "$(echo "scale=1; $(stat -c %s "$T/no-sidewalks.pmtiles")/1000000" | bc)" >> "$T/body.md"
          printf -- '- Downloads: Northern California %s MB, San Francisco %s MB, its highway ways %s MB.\n' \
            "$(echo "scale=0; $(stat -c %s "$T/norcal.osm.pbf")/1000000" | bc)" "$(echo "scale=1; $(stat -c %s "$T/sf.osm.pbf")/1000000" | bc)" "$(echo "scale=1; $(stat -c %s "$T/sf-highways.osm")/1000000" | bc)" >> "$T/body.md"
          { echo "**Built the OSM ways ($asof)**"; echo; cat "$T/body.md"; } > "$T/summary.md"
          python3 - "$asof" <<'PY'
          import sys, json, pathlib
          asof = sys.argv[1]
          i = json.loads(pathlib.Path('data/osm/index.json').read_text())
          line = (f"- **OSM ways** ({asof}): {i['pieces']:,} pieces from {i['ways']:,} ways; {sum(i['gaps'].values()):,} run along no city street "
                  f"(`data/osm/ways.pmtiles`, `data/osm/gaps/`). © OpenStreetMap contributors, ODbL.")
          pathlib.Path('changes/rebuild-osm.md').write_text(line + '\n')
          PY
          cat "$T/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Build the street facts
        if: >-
          inputs.kind == 'Street facts'
          || (inputs.kind == 'Map layer' && contains(fromJSON('["street_trees","businesses"]'), inputs.id))
          || (inputs.kind == 'Boundary set' && contains(fromJSON('["census_blocks","supervisor_districts","assembly_districts","state_senate_districts","us_house_districts","bart_districts","community_benefit_district","cultural_districts","historic_districts"]'), inputs.id))
        env:
          IN_KIND: ${{ inputs.kind }}
        run: |
          python3 scripts/build_facts.py 2> "$RUNNER_TEMP/facts.txt"; cat "$RUNNER_TEMP/facts.txt"
          python3 - "$RUNNER_TEMP/summary.md" "$RUNNER_TEMP/facts.txt" "$IN_KIND" <<'PY'
          import sys, json, pathlib
          out, logf, kind = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2]), sys.argv[3]
          d = json.loads(pathlib.Path('data/facts/streets.json').read_text())
          sizes = ' '.join(l.split(': ', 1)[1] for l in logf.read_text().splitlines() if l.startswith('wrote data/facts/streets'))
          line = f"- **Street facts rebuilt** for {len(d['rows']):,} street blocks ({sizes})."
          if kind == 'Street facts': out.write_text('**Rebuilt the street facts**\n\n' + line + '\n')
          else:
              with out.open('a') as f: f.write('\n' + line + '\n')
          with open('changes/rebuild-facts.md', 'a') as f: f.write(line + '\n')
          PY
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
      # the same checks as check.yml: GitHub doesn't run workflows on pull requests an action opens
      - name: Check data
        env:
          IN_KIND: ${{ inputs.kind }}
          IN_ID: ${{ inputs.id }}
        run: |
          for f in region.json data/aliases.json data/boundaries/*.json data/search/*.json data/search/addresses/*.json $(ls data/facts/*.json 2>/dev/null) $(ls data/osm/*.json data/osm/gaps/*.json 2>/dev/null); do python3 -m json.tool "$f" > /dev/null || { echo "Bad JSON: $f"; exit 1; }; done
          python3 scripts/get_layers.py --check
          python3 scripts/build_tiles.py --check --require "$([ "$IN_KIND" = "Map layer" ] && echo "$IN_ID")"
          printf '\n**Checks passed:** the JSON files parse and every boundary set passes `get_layers.py --check`.\n' >> "$RUNNER_TEMP/summary.md"
      - name: Commit and open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          IN_ID: ${{ steps.branch.outputs.id }}
          BRANCH: ${{ steps.branch.outputs.name }}
          NEW: ${{ steps.branch.outputs.new }}
          IN_KIND: ${{ inputs.kind }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data changes
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "$(head -1 "$RUNNER_TEMP/summary.md" | tr -d '*')" -m "Run by ${GITHUB_ACTOR} with the Build data action."
          git push origin "HEAD:$BRANCH"
          # pushes from an action don't start other workflows, but a dispatch does: run the PR checks on this commit
          gh workflow run check.yml --ref "$BRANCH" || true
          if [ "$NEW" = 1 ]; then
            gh pr create --base main --head "$BRANCH" --title "$IN_KIND: $IN_ID" --body-file "$RUNNER_TEMP/summary.md"
          else
            pr=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number')
            if [ -n "$pr" ]; then gh pr comment "$pr" --body-file "$RUNNER_TEMP/summary.md"
            else gh pr create --base main --head "$BRANCH" --title "$IN_KIND: $IN_ID" --body-file "$RUNNER_TEMP/summary.md"; fi
          fi
