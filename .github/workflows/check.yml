# On every pull request: the JSON files parse, every boundary set passes get_layers.py --check (no
# duplicate ids, every area has its key, expected counts), every map layer the pull request adds or edits is
# built from its current entry, and match_blocks.py still gets right the fixes in tests/corrections/ it got
# right before. It also notes when a pull request edits VERSION or CHANGELOG.md, which the Stamp version
# action does after the merge (pull requests add changes/<name>.md instead).
# Pull requests the Build data action opens or adds to don't start this by themselves (GitHub's rule for
# action-made commits), so that action starts it with a dispatch on the branch.
name: Check data
on:
  pull_request:
    paths: ['data/**', 'region.json', 'scripts/**', 'tests/**', 'changes/**', 'VERSION', 'CHANGELOG.md']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: JSON parses
        run: |
          for f in region.json data/aliases.json data/boundaries/*.json data/tiles/*.json $(ls data/tiles/sources/*.json 2>/dev/null) data/search/*.json data/search/addresses/*.json $(ls data/facts/*.json 2>/dev/null); do python3 -m json.tool "$f" > /dev/null || { echo "Bad JSON: $f"; exit 1; }; done
      - name: Boundary sets
        run: python3 scripts/get_layers.py --check
      - name: Map layers (the ones this pull request adds or edits must be built)
        run: |
          base=${{ github.event.pull_request.base.sha || '' }}
          [ -n "$base" ] || base=$(git merge-base origin/main HEAD)
          ids=$(python3 scripts/build_tiles.py --changed-since "$base")
          echo "Added or edited: ${ids:-none}"
          python3 scripts/build_tiles.py --check --require "$ids"
      - name: Versions are stamped after the merge
        run: |
          base=${{ github.event.pull_request.base.sha || '' }}
          [ -n "$base" ] || base=$(git merge-base origin/main HEAD)
          if git diff --name-only "$base" HEAD | grep -qxE 'VERSION|CHANGELOG.md'; then
            echo "::warning::This pull request edits VERSION or CHANGELOG.md. Put its notes in changes/<name>.md instead; they're stamped after the merge (changes/README.md)."
          fi
          if git diff --name-only "$base" HEAD | grep -qE '^(data|scripts)/' && ! git diff --name-only --diff-filter=AM "$base" HEAD | grep -qE '^changes/.+\.md$'; then
            echo "::notice::No note in changes/ yet. Add changes/<name>.md with a line about what changed (docs-only changes don't need one)."
          fi
      - name: Matcher still gets the fixes it got before
        run: python3 scripts/test_matcher.py
