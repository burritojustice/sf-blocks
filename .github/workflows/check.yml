# On every pull request: the JSON files parse, and every boundary set passes get_layers.py --check
# (no duplicate ids, every area has its key, expected counts), and match_blocks.py still gets right the
# fixes in tests/corrections/ it got right before.
# Pull requests opened by the Add action don't trigger this (GitHub's rule for action-made PRs), so that
# action runs the same checks itself; keep the two in step.
name: Check data
on:
  pull_request:
    paths: ['data/**', 'region.json', 'scripts/**', 'tests/**']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: JSON parses
        run: |
          for f in region.json data/aliases.json data/boundaries/*.json data/search/*.json data/search/addresses/*.json; do python3 -m json.tool "$f" > /dev/null || { echo "Bad JSON: $f"; exit 1; }; done
      - name: Boundary sets
        run: python3 scripts/get_layers.py --check
      - name: Map layers
        run: python3 scripts/build_tiles.py --check
      - name: Matcher still gets the fixes it got before
        run: python3 scripts/test_matcher.py
